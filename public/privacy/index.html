<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Privacy Policies — NovaByte Studios</title>
<meta name="description" content="Privacy policies for games published by NovaByte Studios PK.">
<style>
  :root {
    --bg: #0d0718; --panel: #170f28; --ink: #f3eefb; --soft: #b7a9cf;
    --line: #2d2142; --accent: #a97bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 0 80px; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lede { color: var(--soft); margin: 0 0 40px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: 0 0 14px; }
  a.game {
    display: block; padding: 20px 22px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
    color: var(--ink); text-decoration: none;
  }
  a.game:hover, a.game:focus-visible { border-color: var(--accent); }
  a.game strong { display: block; font-size: 1.1rem; }
  a.game span { color: var(--soft); font-size: 0.92rem; }
  footer { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--soft); font-size: 0.9rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Game privacy policies</h1>
    <p class="lede">
      Each game NovaByte Studios publishes has its own policy, because each one
      collects different things. Pick the game you are playing.
    </p>

    <ul>
      <li>
        <a class="game" href="slice-n-dice.html">
          <strong>Slice n Dice</strong>
          <span>com.novabyte.slicendice</span>
        </a>
      </li>
    </ul>

    <footer>
      <p>
        For anything not covered here, contact
        <a href="mailto:wasay6788@gmail.com">wasay6788@gmail.com</a>.
        <br>
        <a href="../">Back to NovaByte Studios</a>
      </p>
    </footer>
  </main>
</body>
</html>
